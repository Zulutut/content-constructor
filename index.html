<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Content Constructor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 600px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px;
      background: white;
    }

    h1 {
      margin-top: 20px;
      font-size: 28px;
    }

    .subtitle {
      color: #777;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .formats {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .format-button {
      width: 100%;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 16px;
      background: white;
      text-align: left;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .format-button:hover {
      background: #f5f5f5;
    }

    .format-button span {
      display: block;
      font-size: 14px;
      color: #777;
      margin-top: 5px;
    }

    .hidden {
      display: none;
    }

    .back {
      border: none;
      background: none;
      padding: 0;
      font-size: 16px;
      cursor: pointer;
      color: #555;
    }

    .input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .primary-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ГЛАВНЫЙ ЭКРАН -->

    <div id="home">

      <h1>Создать задачу</h1>

      <div class="subtitle">
        Соберите понятное ТЗ для дизайнера или монтажёра
      </div>

      <div class="section-title">
        Что создаём?
      </div>

      <div class="formats">

        <button class="format-button" onclick="openCarousel()">
          📑 Карусель
          <span>
            Слайды, текст, материалы и референсы
          </span>
        </button>

        <button class="format-button">
          🎬 Reels
          <span>
            Сцены, видео, текст и пожелания
          </span>
        </button>

        <button class="format-button">
          ▶️ YouTube
          <span>
            Структура видео и материалы
          </span>
        </button>

      </div>

    </div>


    <!-- КАРУСЕЛЬ -->

    <div id="carousel" class="hidden">

      <button class="back" onclick="goHome()">
        ← Назад
      </button>

      <h1>Новая карусель</h1>

      <div class="subtitle">
        Сначала расскажите немного о задаче
      </div>

      <div class="section-title">
        Название
      </div>

      <input
        class="input"
        type="text"
        placeholder="Например: 5 ошибок начинающего эксперта"
      >

      <div class="section-title">
        О чём эта карусель?
      </div>

      <textarea
        class="input"
        placeholder="Напишите своими словами, что хотите рассказать..."
      ></textarea>

      <div class="section-title">
        Общие пожелания
      </div>

      <textarea
        class="input"
        placeholder="Например: минималистично, современно, без перегруза..."
      ></textarea>

      <button class="primary-button">
        Продолжить →
      </button>

    </div>

  </div>


  <script>

    function openCarousel() {
      document.getElementById("home").classList.add("hidden");
      document.getElementById("carousel").classList.remove("hidden");
    }

    function goHome() {
      document.getElementById("carousel").classList.add("hidden");
      document.getElementById("home").classList.remove("hidden");
    }

  </script>

</body>
</html>
